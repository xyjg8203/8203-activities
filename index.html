<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>西安冶金建筑学院建工系8203班 · 活动大事记</title>
  <style>
    /* ============ 全局基础 ============ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --gold: #c9a84c;
      --gold-light: #e8d48b;
      --burgundy: #8b1a2b;
      --brown: #5c3d2e;
      --cream: #faf6ee;
      --cream-dark: #f0e8d5;
      --text: #2c1810;
      --text-light: #6b5b4e;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
      --radius: 12px;
      --radius-sm: 8px;
      --font: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,-apple-system,sans-serif;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--cream);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ============ 登录页 ============ */
    .login-page {
      position: fixed; inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2c1810 0%, #4a2820 40%, #3d1f18 100%);
    }
    .login-page.hidden { display: none; }
    .login-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 48px 32px 36px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }
    .login-card .emblem {
      font-size: 48px;
      margin-bottom: 8px;
      display: block;
    }
    .login-card h1 {
      font-size: 18px;
      color: var(--brown);
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1.5;
    }
    .login-card p {
      font-size: 13px;
      color: var(--text-light);
      margin: 12px 0 24px;
    }
    .login-card input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0d5c8;
      border-radius: var(--radius-sm);
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
      background: #fff;
      text-align: center;
      letter-spacing: 4px;
    }
    .login-card input:focus { border-color: var(--gold); }
    .login-card button {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #3d1f18;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      letter-spacing: 2px;
    }
    .login-card button:active { transform: scale(0.97); }
    .login-error {
      color: #c0392b;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    /* ============ 顶栏 ============ */
    .header {
      background: linear-gradient(135deg, #2c1810 0%, #4a2820 50%, #3d1f18 100%);
      color: #fff;
      padding: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 800px;
      margin: 0 auto;
      padding: 16px 20px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header .badge {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1.3;
    }
    .header .sub {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      margin-top: 1px;
    }

    /* ============ 老照片画廊 ============ */
    .gallery-section {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px 20px 8px;
    }
    .gallery-section h2 {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 12px;
      letter-spacing: 2px;
      font-weight: 600;
    }
    .gallery-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 8px;
    }
    .gallery-scroll::-webkit-scrollbar { height: 4px; }
    .gallery-scroll::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }
    .gallery-scroll::-webkit-scrollbar-track { background: #e0d5c8; border-radius: 4px; }
    .gallery-item {
      flex-shrink: 0;
      width: 200px;
      height: 160px;
      border-radius: var(--radius);
      overflow: hidden;
      scroll-snap-align: start;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.3s;
      position: relative;
    }
    .gallery-item:active { transform: scale(0.97); }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .gallery-item .overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 8px 10px;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      color: #fff;
      font-size: 11px;
    }

    /* ============ 照片查看器弹窗 ============ */
    .photo-viewer {
      position: fixed; inset: 0;
      z-index: 2000;
      background: rgba(0,0,0,0.92);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .photo-viewer.active { display: flex; }
    .photo-viewer img {
      max-width: 95%;
      max-height: 80vh;
      border-radius: 8px;
      object-fit: contain;
    }
    .photo-viewer .caption {
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      margin-top: 12px;
    }
    .photo-viewer .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px; height: 40px;
      border: none;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }

    /* ============ 主区域 ============ */
    .main-content {
      max-width: 800px;
      margin: 0 auto;
      padding: 12px 20px 60px;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .section-header h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--brown);
    }

    /* 时间线样式 */
    .timeline { position: relative; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 20px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, var(--gold), var(--cream-dark));
    }
    .activity-card {
      position: relative;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 20px 20px 52px;
      margin-bottom: 16px;
    }
    .activity-card::before {
      content: '';
      position: absolute;
      left: 13px;
      top: 28px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      border: 3px solid var(--cream);
      z-index: 1;
    }
    .activity-card .date-tag {
      display: inline-block;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #3d1f18;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .activity-card h3 {
      font-size: 17px;
      font-weight: 700;
      color: var(--brown);
      margin-bottom: 6px;
    }
    .activity-card .content {
      font-size: 14px;
      color: var(--text-light);
      line-height: 1.7;
    }
    .activity-card .files {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .activity-card .file-item {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .activity-card .file-item img,
    .activity-card .file-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .activity-card .file-item .play-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }
    .empty-state .icon { font-size: 64px; opacity: 0.4; }
    .empty-state p { margin-top: 12px; font-size: 14px; }

    /* ============ 底部 ============ */
    .footer {
      text-align: center;
      padding: 20px;
      color: #b0a090;
      font-size: 11px;
      letter-spacing: 2px;
    }

    /* ============ 响应式 ============ */
    @media (min-width: 600px) {
      .gallery-item { width: 240px; height: 180px; }
      .activity-card { padding: 24px 24px 24px 56px; }
      .activity-card::before { left: 15px; top: 32px; }
    }
  </style>
</head>
<body>

<!-- ========== 登录页 ========== -->
<div class="login-page" id="loginPage">
  <div class="login-card">
    <span class="emblem">🏛️</span>
    <h1>西安冶金建筑学院<br>建工系8203班</h1>
    <p>请输入活动密码查看班级大事记</p>
    <input type="password" id="passwordInput" placeholder="输入密码" maxlength="20" autocomplete="off">
    <button onclick="doLogin()">进入</button>
    <div class="login-error" id="loginError">密码错误，请重新输入</div>
  </div>
</div>

<!-- ========== 顶部导航 ========== -->
<div class="header" id="appHeader" style="display:none;">
  <div class="header-inner">
    <div class="badge">8203</div>
    <div>
      <h1>建工系8203班 · 活动大事记</h1>
      <div class="sub">西安冶金建筑学院</div>
    </div>
  </div>
</div>

<!-- ========== 老照片画廊 ========== -->
<div id="gallerySection" style="display:none;">
  <div class="gallery-section">
    <h2>📷 时光留影</h2>
    <div class="gallery-scroll" id="galleryScroll"></div>
  </div>
</div>

<!-- ========== 活动列表 ========== -->
<div class="main-content" id="appMain" style="display:none;">
  <div class="section-header">
    <h2>📋 活动记录</h2>
  </div>
  <div class="timeline" id="activityList"></div>
</div>

<!-- ========== 照片查看器 ========== -->
<div class="photo-viewer" id="photoViewer" onclick="closeViewer(event)">
  <button class="close-btn" onclick="closeViewer()">✕</button>
  <img id="viewerImg" src="" alt="">
  <div class="caption" id="viewerCaption"></div>
</div>

<!-- ========== 底部 ========== -->
<div class="footer" id="appFooter" style="display:none;">
  西安冶金建筑学院 · 建工系8203班
</div>

<script>
// ============ 密码 ============
const PASSWORD = '8203';

// ============ 照片画廊数据 ============
const GALLERY = [
  { src: 'photo1.jpg', caption: '80年代 · 青春合影' },
  { src: 'photo2.jpg', caption: '校名铭牌 · 西安冶金建筑学院' },
  { src: 'photo3.jpg', caption: '黑白 · 老校门' },
  { src: 'photo4.jpg', caption: '近年 · 重聚留念' }
];

// ============ 工具函数 ============
function $(id) { return document.getElementById(id); }
function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatDate(d) {
  const dt = new Date(d);
  const y = dt.getFullYear();
  const m = String(dt.getMonth()+1).padStart(2,'0');
  const day = String(dt.getDate()).padStart(2,'0');
  const week = ['日','一','二','三','四','五','六'][dt.getDay()];
  return `${y}年${m}月${day}日 周${week}`;
}

// ============ 登录 ============
function doLogin() {
  const pw = $('passwordInput').value;
  if (pw === PASSWORD) {
    $('loginPage').classList.add('hidden');
    $('appHeader').style.display = '';
    $('gallerySection').style.display = '';
    $('appMain').style.display = '';
    $('appFooter').style.display = '';
    initGallery();
    loadActivities();
  } else {
    $('loginError').style.display = 'block';
    $('passwordInput').value = '';
    $('passwordInput').focus();
  }
}
$('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// ============ 画廊 ============
function initGallery() {
  const c = $('galleryScroll');
  c.innerHTML = GALLERY.map((g,i) =>
    `<div class="gallery-item" onclick="openViewer(${i})">
      <img src="${g.src}" alt="${g.caption}" loading="lazy">
      <div class="overlay">${g.caption}</div>
    </div>`
  ).join('');
}

// ============ 照片查看器 ============
function openViewer(idx) {
  const g = GALLERY[idx] || { src: '', caption: '' };
  $('viewerImg').src = g.src;
  $('viewerCaption').textContent = g.caption;
  $('photoViewer').classList.add('active');
}
function closeViewer(e) {
  if (e && e.target !== e.currentTarget) return;
  $('photoViewer').classList.remove('active');
}

// ============ 加载活动数据 ============
function loadActivities() {
  fetch('data.json')
    .then(r => r.json())
    .then(data => {
      const list = $('activityList');
      if (!data || data.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="icon">📖</div>
            <p>还没有活动记录，敬请期待</p>
          </div>`;
        return;
      }
      // 按日期倒序排列
      data.sort((a, b) => new Date(b.date) - new Date(a.date));
      list.innerHTML = data.map(a => `
        <div class="activity-card">
          <span class="date-tag">${formatDate(a.date)}</span>
          <h3>${escapeHtml(a.title)}</h3>
          ${a.content ? `<div class="content">${escapeHtml(a.content).replace(/\n/g, '<br>')}</div>` : ''}
          ${a.files && a.files.length > 0 ? `
            <div class="files">
              ${a.files.map(f => {
                const isVideo = f.match(/\.(mp4|mov|avi|webm)$/i);
                if (isVideo) {
                  return `<div class="file-item" onclick="playVideo('${f}')">
                    <video src="${f}" preload="metadata"></video>
                    <div class="play-icon">▶</div>
                  </div>`;
                }
                return `<div class="file-item" onclick="openPic('${f}')">
                  <img src="${f}" loading="lazy">
                </div>`;
              }).join('')}
            </div>` : ''}
        </div>
      `).join('');
    })
    .catch(err => {
      $('activityList').innerHTML = `<div class="empty-state"><div class="icon">📖</div><p>活动数据加载失败</p></div>`;
    });
}

function openPic(url) {
  $('viewerImg').src = url;
  $('viewerCaption').textContent = '';
  $('photoViewer').classList.add('active');
}
function playVideo(url) {
  $('viewerImg').style.display = 'none';
  $('photoViewer').querySelector('.caption').style.display = 'none';
  $('photoViewer').innerHTML = `
    <button class="close-btn" onclick="closeVideoViewer()">✕</button>
    <video src="${url}" controls autoplay style="max-width:95%;max-height:80vh;border-radius:8px;"></video>
  `;
  $('photoViewer').classList.add('active');
}
function closeVideoViewer() {
  $('photoViewer').innerHTML = `
    <button class="close-btn" onclick="closeViewer()">✕</button>
    <img id="viewerImg" src="" alt="">
    <div class="caption" id="viewerCaption"></div>
  `;
  $('photoViewer').classList.remove('active');
}
</script>
</body>
</html>
